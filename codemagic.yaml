workflows:
  woa-ci-build:
    name: WOA - CI Build (Debug)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "src/WOA.xcodeproj"
        XCODE_SCHEME: "WOA"
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: "*"
          include: true
    scripts:
      - name: Resolve Swift Package dependencies
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"
      - name: Build (Debug, macOS, unsigned)
        script: |
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "platform=macOS" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - build/**/*.log

  woa-release-build:
    name: WOA - Release Build & Package
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "src/WOA.xcodeproj"
        XCODE_SCHEME: "WOA"
      # Configure a signing certificate + provisioning profile group in the
      # Codemagic UI (Code signing identities) and reference it here, e.g.:
      # groups:
      #   - woa_macos_signing
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true
    scripts:
      - name: Resolve Swift Package dependencies
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"
      - name: Build, archive and export via release script
        script: |
          chmod +x build_release.sh
          ./build_release.sh
    artifacts:
      - build/*.pkg
      - build/*.dmg
      - build/*.xcarchive
      - build/**/*.log
